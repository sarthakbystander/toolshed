</header>

  <main class="wrap">
    <section class="toolhead">
      <div class="crumb"><a href="../..">← back to the drawer</a> / csv-to-json</div>
      <h1>CSV to JSON</h1>
      <p>Paste CSV, get JSON. Header detection, type inference and quote handling, all in your tab.</p>
    </section>

    <section class="toolbody">
      <div class="pane">
        <div class="pane-header">
          <label class="pane-title" for="csv-input">YOUR CSV</label>
          <button type="button" class="btn secondary" id="btn-sample">Load sample</button>
        </div>
        <textarea id="csv-input" placeholder='name,age,city&#10;alice,30,"Austin, TX"&#10;bob,25,"San Jose, CA"' spellcheck="false" autocomplete="off"></textarea>

        <div class="csv-options">
          <label for="opt-header"><input type="checkbox" id="opt-header" checked> First row is a header</label>
          <label for="opt-infer"><input type="checkbox" id="opt-infer" checked> Infer types</label>
          <label for="opt-delimiter">Delimiter
            <select id="opt-delimiter">
              <option value="auto">auto</option>
              <option value=",">comma</option>
              <option value=";">semicolon</option>
              <option value="	">tab</option>
              <option value="|">pipe</option>
            </select>
          </label>
        </div>

        <div class="row">
          <button type="button" class="btn" id="btn-convert">Convert</button>
          <button type="button" class="btn danger" id="btn-clear">Clear</button>
        </div>
      </div>

      <div class="pane">
        <div class="pane-header">
          <span class="pane-title">JSON OUT</span>
          <div class="row">
            <span class="out-count hidden" id="out-count"></span>
            <button type="button" class="btn secondary" id="btn-copy" disabled>Copy</button>
          </div>
        </div>
        <textarea id="json-output" readonly placeholder="converted JSON shows up here" spellcheck="false"></textarea>
        <div class="status hidden" id="status" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="tool.js"></script>
  <script>
    (function () {
      "use strict";
      var lib = window.Toolshed.csvToJson;
      var input = document.getElementById("csv-input");
      var output = document.getElementById("json-output");
      var statusEl = document.getElementById("status");
      var countEl = document.getElementById("out-count");
      var btnCopy = document.getElementById("btn-copy");
      var autoHeader = document.getElementById("opt-header");
      var autoInfer = document.getElementById("opt-infer");
      var delimSel = document.getElementById("opt-delimiter");
      var lastJson = null;

      var SAMPLE = [
        "name,age,city,active",
        'alice,30,"Austin, TX",true',
        'bob,25,"San Jose, CA",false',
        '"chen, wei",41,Seattle,true',
        "dana,27,Boston,"
      ].join("\n");

      function setStatus(message, kind) {
        statusEl.textContent = message;
        statusEl.classList.remove("hidden");
        statusEl.classList.remove("error", "ok");
        if (kind) statusEl.classList.add(kind);
      }

      function run() {
        var text = input.value;
        if (!text.trim()) {
          setStatus("Paste some CSV first.", "error");
          output.value = "";
          lastJson = null;
          btnCopy.disabled = true;
          countEl.classList.add("hidden");
          return;
        }
        var delimiter = delimSel.value === "auto" ? lib.detectDelimiter(text) : delimSel.value;
        var options = {
          header: autoHeader.checked,
          inferTypes: autoInfer.checked,
          delimiter: delimiter
        };
        var result = lib.convert(text, options);
        if (!result.ok) {
          setStatus(result.error || "Something went wrong.", "error");
          output.value = "";
          lastJson = null;
          btnCopy.disabled = true;
          countEl.classList.add("hidden");
          return;
        }
        lastJson = result.json;
        output.value = JSON.stringify(result.json, null, 2);
        countEl.textContent = result.rows + " row" + (result.rows === 1 ? "" : "s");
        countEl.classList.remove("hidden");
        btnCopy.disabled = false;
        statusEl.classList.add("hidden");
      }

      function copyOut() {
        if (!lastJson) return;
        if (!navigator.clipboard) {
          setStatus("Clipboard API unavailable in this browser.");
          return;
        }
        navigator.clipboard.writeText(JSON.stringify(lastJson, null, 2)).then(function () {
          var old = btnCopy.textContent;
          btnCopy.textContent = "Copied";
          setTimeout(function () { btnCopy.textContent = old; }, 1200);
        }).catch(function () {
          setStatus("Copy blocked by the browser.");
        });
      }

      document.getElementById("btn-convert").addEventListener("click", run);
      document.getElementById("btn-copy").addEventListener("click", copyOut);
      document.getElementById("btn-sample").addEventListener("click", function () {
        input.value = SAMPLE;
        run();
      });
      document.getElementById("btn-clear").addEventListener("click", function () {
        input.value = "";
        output.value = "";
        lastJson = null;
        btnCopy.disabled = true;
        countEl.classList.add("hidden");
        statusEl.classList.add("hidden");
        input.focus();
      });
      input.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run();
      });
    })();
  </script>
</body>
</html>
