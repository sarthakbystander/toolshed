  <main class="wrap">
    <section class="toolhead">
      <div class="crumb"><a href="../..">← back to the drawer</a> / json-formatter</div>
      <h1>JSON Formatter</h1>
      <p>Feed it messy JSON, get tidy JSON back. Validate, format, or minify — all locally in your tab.</p>
    </section>

    <section class="toolbody" id="toolbody">
      <div class="pane">
        <label class="pane-title" for="input-json">PASTE YOUR MESS</label>
        <textarea id="input-json" placeholder='{"example": true, "items": [1, 2, 3]}' spellcheck="false" autocomplete="off"></textarea>
        <div class="status hidden" id="status" role="status" aria-live="polite"></div>
      </div>

      <div class="pane" id="output-pane">
        <div class="pane-header">
          <label class="pane-title" for="output-json">OUT COMES THIS</label>
          <div class="row">
            <button type="button" class="btn secondary" id="btn-copy" disabled>Copy</button>
          </div>
        </div>
        <textarea id="output-json" readonly placeholder="tidy JSON shows up here" spellcheck="false"></textarea>
        <div class="row" style="margin-top:10px;">
          <button type="button" class="btn" id="btn-format">Tidy it up</button>
          <button type="button" class="btn secondary" id="btn-minify">Minify</button>
          <button type="button" class="btn danger" id="btn-clear">Clear</button>
        </div>
        <p class="hint">bad JSON? we'll tell you exactly where.</p>
      </div>
    </section>
  </main>

  <script src="tool.js"></script>
  <script>
    (function () {
      "use strict";
      var lib = window.Toolshed.jsonFormatter;
      var input = document.getElementById("input-json");
      var output = document.getElementById("output-json");
      var status = document.getElementById("status");
      var btnFormat = document.getElementById("btn-format");
      var btnMinify = document.getElementById("btn-minify");
      var btnClear = document.getElementById("btn-clear");
      var btnCopy = document.getElementById("btn-copy");
      var lastWasError = false;
      var lastValidText = null;

      function setStatus(message, kind) {
        status.textContent = message;
        status.classList.remove("hidden");
        status.classList.remove("error", "ok");
        if (kind) status.classList.add(kind);
        output.classList.remove("placeholder");
      }

      function run(mode) {
        var text = input.value;
        if (!text.trim()) {
          setStatus("Input is empty. Paste some JSON to get started.", "error");
          output.value = "";
          btnCopy.disabled = true;
          return;
        }
        var result = mode === "minify" ? lib.minifyText(text) : lib.formatText(text);
        if (result.ok) {
          output.value = result.text;
          lastValidText = result.text;
          lastWasError = false;
          btnCopy.disabled = false;
          setStatus((mode === "minify" ? "Minified" : "Formatted") + " " + countNodes(result.text) + " · valid JSON", "ok");
        } else {
          output.value = "";
          lastValidText = null;
          lastWasError = true;
          btnCopy.disabled = true;
          setStatus("Invalid JSON — line " + result.error.line + ", column " + result.error.column + ": " + (result.error.message || "syntax error"), "error");
        }
      }

      function countNodes(text) {
        try {
          var v = JSON.parse(text);
          var n = 0;
          function walk(x) {
            n++;
            if (Array.isArray(x)) { for (var i = 0; i < x.length; i++) walk(x[i]); }
            else if (x && typeof x === "object") { for (var k in x) walk(x[k]); }
          }
          if (Array.isArray(v) || (v && typeof v === "object")) walk(v); else n = 1;
          return n + " value" + (n === 1 ? "" : "s");
        } catch (e) {
          return "";
        }
      }

      function copyOutput() {
        if (!lastValidText) return;
        if (!navigator.clipboard) {
          setStatus("Clipboard API unavailable in this browser.", "error");
          return;
        }
        navigator.clipboard.writeText(lastValidText).then(function () {
          var old = btnCopy.textContent;
          btnCopy.textContent = "Copied ✓";
          setStatus("Copied to clipboard.", "ok");
          setTimeout(function () { btnCopy.textContent = old; }, 1500);
        }).catch(function () {
          setStatus("Copy blocked by the browser. Select the text and copy with Ctrl/Cmd+C.", "error");
        });
      }

      function clearAll() {
        input.value = "";
        output.value = "";
        lastValidText = null;
        btnCopy.disabled = true;
        status.classList.add("hidden");
        input.focus();
      }

      btnFormat.addEventListener("click", function () { run("format"); });
      btnMinify.addEventListener("click", function () { run("minify"); });
      btnClear.addEventListener("click", clearAll);
      btnCopy.addEventListener("click", copyOutput);

      // Live validation as you type — but only surface once there's content.
      input.addEventListener("input", function () {
        if (input.value.trim()) {
          var result = lib.parseJSON(input.value);
          if (result.ok) {
            status.classList.remove("hidden", "error", "ok");
            status.textContent = "Valid JSON ✓  " + countNodes(input.value);
            status.classList.add("ok");
          } else {
            status.classList.add("error");
            status.textContent = "Invalid JSON — line " + result.error.line + ", column " + result.error.column + ": " + (result.error.message || "syntax error");
          }
        } else {
          status.classList.add("hidden");
        }
      });
    })();
  </script>
</body>
</html>
