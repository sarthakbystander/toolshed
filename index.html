<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Toolshed — an open-source collection of useful web tools, free to use, easy to contribute to, and built to run directly in your browser.">
  <meta name="theme-color" content="#1e293b">
  <title>Toolshed — Useful Web Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%B0%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header>
    <h1>Toolshed</h1>
    <p>An open-source collection of useful web tools — free to use, easy to contribute to, and built to run directly in your browser.</p>
  </header>

  <main>
    <section id="tools" aria-labelledby="tools-heading">
      <h2 id="tools-heading">Tools</h2>
      <!--
        The tool registry is generated by `npm run generate`.
        The homepage data (cards, search, categories) will be derived
        from registry/tools.json by future generation steps. The registry is
        currently empty, so no tools are listed yet.
        -->
      <p class="empty-registry">No tools yet — the first tool contribution is welcome!</p>
    </section>
  </main>

  <footer>
    <p>Toolshed is open source. Tools run locally in your browser. See <a href="https://github.com/sarthakbystander/toolshed">the repository</a> for more.</p>
  </footer>
</body>
</html>
